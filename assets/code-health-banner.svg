<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Bad code transforms into healthy code: a red 4.2 health gauge becomes a green 9.7, smells disappear">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="arcGreen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ea043"/>
      <stop offset="1" stop-color="#3fb950"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- card -->
  <rect x="0" y="0" width="1200" height="440" rx="20" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="20" fill="none" stroke="#30363d" stroke-width="1"/>

  <!-- title -->
  <text x="600" y="58" text-anchor="middle" fill="#e6edf3" font-size="30" font-weight="700">messy code <tspan fill="#8b949e" font-weight="500">→</tspan> healthy code</text>
  <text x="600" y="88" text-anchor="middle" fill="#8b949e" font-size="16">an objective health score drives a self-correcting refactoring loop until the code is AI-ready</text>

  <!-- ============ BEFORE gauge (static, red) ============ -->
  <g>
    <!-- track -->
    <path d="M 190 300 A 130 130 0 0 1 450 300" fill="none" stroke="#21262d" stroke-width="22" stroke-linecap="round"/>
    <!-- value 42% (length pi*130=408.4, offset=408.4*0.58=236.9) -->
    <path d="M 190 300 A 130 130 0 0 1 450 300" fill="none" stroke="#f85149" stroke-width="22" stroke-linecap="round" stroke-dasharray="408.4" stroke-dashoffset="236.9"/>
    <!-- needle -->
    <g transform="rotate(-14.4 320 300)">
      <polygon points="314,300 326,300 320,196" fill="#f85149"/>
      <circle cx="320" cy="300" r="10" fill="#f85149"/>
    </g>
    <text x="320" y="288" text-anchor="middle" fill="#f85149" font-size="56" font-weight="800">4.2</text>
    <text x="320" y="330" text-anchor="middle" fill="#8b949e" font-size="15">/ 10</text>
    <text x="320" y="364" text-anchor="middle" fill="#f85149" font-size="16" font-weight="700" letter-spacing="2">RED ZONE</text>
    <!-- smell dots -->
    <g>
      <circle cx="248" cy="398" r="7" fill="#f85149"/>
      <circle cx="272" cy="398" r="7" fill="#f85149"/>
      <circle cx="296" cy="398" r="7" fill="#f85149"/>
      <circle cx="320" cy="398" r="7" fill="#f85149"/>
      <circle cx="344" cy="398" r="7" fill="#f85149"/>
      <circle cx="368" cy="398" r="7" fill="#f85149"/>
      <circle cx="392" cy="398" r="7" fill="#f85149"/>
    </g>
    <text x="320" y="424" text-anchor="middle" fill="#8b949e" font-size="14">7 smells · God Class, deep nesting, magic numbers…</text>
  </g>

  <!-- ============ middle arrow / loop ============ -->
  <g transform="translate(600 250)">
    <path d="M -54 0 L 40 0" fill="none" stroke="#3fb950" stroke-width="4" stroke-linecap="round">
      <animate attributeName="stroke-dashoffset" begin="0.2s" dur="1s" values="94;0" fill="freeze"/>
      <set attributeName="stroke-dasharray" to="94"/>
    </path>
    <polygon points="40,-9 58,0 40,9" fill="#3fb950">
      <animate attributeName="opacity" begin="0s" dur="1.2s" values="0;0;1" keyTimes="0;0.7;1" fill="freeze"/>
    </polygon>
    <text x="2" y="-22" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">auto-refactor</text>
    <text x="2" y="34" text-anchor="middle" fill="#8b949e" font-size="13" font-weight="600">loop ↻</text>
  </g>

  <!-- ============ AFTER gauge (animated red → green) ============ -->
  <g>
    <!-- track -->
    <path d="M 750 300 A 130 130 0 0 1 1010 300" fill="none" stroke="#21262d" stroke-width="22" stroke-linecap="round"/>
    <!-- value: fills from empty to 97% (offset 408.4 -> 12.25), colour red -> amber -> green -->
    <path d="M 750 300 A 130 130 0 0 1 1010 300" fill="none" stroke="#f85149" stroke-width="22" stroke-linecap="round" stroke-dasharray="408.4" stroke-dashoffset="408.4" filter="url(#soft)">
      <animate attributeName="stroke-dashoffset" begin="0.5s" dur="3.2s" values="408.4;12.25" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
      <animate attributeName="stroke" begin="0.5s" dur="3.2s" values="#f85149;#d29922;#3fb950" keyTimes="0;0.5;1" fill="freeze"/>
    </path>
    <!-- needle sweeps from -90 (empty) to 84.6 (97%) -->
    <g>
      <polygon points="874,300 886,300 880,196" fill="#3fb950"/>
      <circle cx="880" cy="300" r="10" fill="#3fb950"/>
      <animateTransform attributeName="transform" type="rotate" begin="0.5s" dur="3.2s" values="-90 880 300;84.6 880 300" keyTimes="0;1" calcMode="spline" keySplines="0.4 0 0.2 1" fill="freeze"/>
    </g>

    <!-- ticking score -->
    <g text-anchor="middle" font-size="56" font-weight="800">
      <text x="880" y="288" fill="#f85149" opacity="0">4.2<set attributeName="opacity" to="1" begin="0.5s"/><set attributeName="opacity" to="0" begin="1.05s"/></text>
      <text x="880" y="288" fill="#d29922" opacity="0">5.4<set attributeName="opacity" to="1" begin="1.05s"/><set attributeName="opacity" to="0" begin="1.6s"/></text>
      <text x="880" y="288" fill="#d29922" opacity="0">6.6<set attributeName="opacity" to="1" begin="1.6s"/><set attributeName="opacity" to="0" begin="2.15s"/></text>
      <text x="880" y="288" fill="#bb9a2a" opacity="0">7.8<set attributeName="opacity" to="1" begin="2.15s"/><set attributeName="opacity" to="0" begin="2.7s"/></text>
      <text x="880" y="288" fill="#5aa832" opacity="0">8.8<set attributeName="opacity" to="1" begin="2.7s"/><set attributeName="opacity" to="0" begin="3.25s"/></text>
      <text x="880" y="288" fill="#3fb950" opacity="0">9.7<set attributeName="opacity" to="1" begin="3.25s"/></text>
    </g>
    <text x="880" y="330" text-anchor="middle" fill="#8b949e" font-size="15">/ 10</text>
    <text x="880" y="364" text-anchor="middle" fill="#3fb950" font-size="16" font-weight="700" letter-spacing="2" opacity="0">HEALTHY · AI-READY<set attributeName="opacity" to="1" begin="3.25s"/></text>

    <!-- smell dots fade out, then a green check -->
    <g>
      <circle cx="808" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="0.9s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="832" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="1.2s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="856" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="1.5s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="880" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="1.8s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="904" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="2.1s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="928" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="2.4s" dur="0.4s" values="1;0" fill="freeze"/></circle>
      <circle cx="952" cy="398" r="7" fill="#f85149"><animate attributeName="opacity" begin="2.7s" dur="0.4s" values="1;0" fill="freeze"/></circle>
    </g>
    <g opacity="0"><set attributeName="opacity" to="1" begin="3.1s"/>
      <circle cx="880" cy="398" r="11" fill="none" stroke="#3fb950" stroke-width="3"/>
      <path d="M 874 398 l 4 5 l 8 -10" fill="none" stroke="#3fb950" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="880" y="424" text-anchor="middle" fill="#8b949e" font-size="14" opacity="0">0 smells · behavior preserved, verified<set attributeName="opacity" to="1" begin="3.25s"/></text>
  </g>
</svg>
